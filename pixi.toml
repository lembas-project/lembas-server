[dependencies]
aiosqlite = "*"
alembic = "*"
fastapi = "*"
httpx = "*"
pydantic = "*"
pydantic-settings = "*"
python = ">=3.12"
sentry-sdk = "*"
sqlalchemy = ">=2.0"
uvicorn = "*"

[environments]
default = {features = ["dev"], solve-group = "default"}

[feature.dev.dependencies]
mypy = "*"
pre-commit = ">=4"
pytest = ">=8"
pytest-alembic = "*"
pytest-asyncio = "*"
pytest-env = "*"
pytest-mock = "*"
ruff = "*"

[tasks]
dev = "uvicorn app.main:app --reload --port 8001"
lint = "ruff check app/ tests/"
test = "pytest --test-alembic tests/"
typecheck = "mypy"

[workspace]
channels = ["conda-forge"]
name = "lembas-server"
platforms = ["osx-arm64", "linux-64"]
